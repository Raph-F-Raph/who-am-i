<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who Am I?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #14162B; color: #F5F3ED; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
  .app { max-width: 430px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  .app.game { height: 100vh; overflow: hidden; }
  .header { padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(245,243,237,0.08); flex-shrink: 0; }
  .back-btn { background: none; border: none; color: rgba(245,243,237,0.45); font-size: 13px; cursor: pointer; padding: 0; }
  .badge { background: rgba(244,201,93,0.15); color: #F4C95D; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .home { padding: 32px 20px; display: flex; flex-direction: column; gap: 28px; }
  .home h1 { font-size: 36px; font-weight: 900; line-height: 1.1; margin-top: 6px; }
  .label { font-size: 12px; color: rgba(245,243,237,0.4); font-weight: 600; margin-bottom: 10px; }
  .mode-row { display: flex; gap: 10px; }
  .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cat-card { background: #1F2242; border: 1px solid rgba(245,243,237,0.08); border-radius: 14px; padding: 18px 14px; text-align: left; cursor: pointer; color: #F5F3ED; }
  .cat-card.active { border-color: #FF6B4A; }
  .cat-emoji { font-size: 26px; }
  .cat-name { margin-top: 8px; font-weight: 700; font-size: 14px; }
  .btn { flex: 1; padding: 14px 0; border-radius: 12px; border: none; font-weight: 800; font-size: 15px; cursor: pointer; }
  .btn-coral { background: #FF6B4A; color: #14162B; }
  .btn-dark { background: rgba(245,243,237,0.06); color: #F5F3ED; border: 1px solid rgba(245,243,237,0.12); }
  .btn-outline { background: transparent; color: rgba(245,243,237,0.45); border: 1px solid rgba(245,243,237,0.1); font-size: 12px !important; }
  .btn-gold { background: transparent; color: #F4C95D; border: 1px solid rgba(244,201,93,0.3); width: 100%; padding: 12px 0; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 8px; }
  .btn-full { width: 100%; padding: 17px 0; border-radius: 12px; border: none; font-weight: 800; font-size: 17px; cursor: pointer; }
  .btn-disabled { background: rgba(245,243,237,0.08); color: rgba(245,243,237,0.25); cursor: default; }
  .btn-row { display: flex; gap: 8px; }
  .avatar { border-radius: 50%; flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; font-weight: 800; background: #FF6B4A; color: #14162B; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pick-screen { padding: 24px 20px; display: flex; flex-direction: column; gap: 20px; }
  .pick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 420px; overflow-y: auto; }
  .pick-card { background: #1F2242; border: 1px solid rgba(245,243,237,0.08); border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; color: #F5F3ED; text-align: left; }
  .pick-card.active { border-color: #FF6B4A; }
  .char-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px; overflow-y: auto; flex: 1; min-height: 0; }
  .char-card { background: #1F2242; border: 1px solid rgba(245,243,237,0.08); border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; color: #F5F3ED; text-align: left; transition: opacity 0.2s; }
  .char-card.out { opacity: 0.25; }
  .char-name { font-size: 12px; font-weight: 600; }
  .char-name.out { text-decoration: line-through; color: rgba(245,243,237,0.3); }
  .panel { padding: 14px 20px 22px; border-top: 1px solid rgba(245,243,237,0.08); background: #181A34; flex-shrink: 0; }
  .q-label { font-size: 12px; color: rgba(245,243,237,0.4); margin-bottom: 8px; }
  .q-selector { display: flex; flex-direction: column; gap: 5px; max-height: 120px; overflow-y: auto; margin-bottom: 10px; }
  .q-option { background: #1F2242; border: 1px solid rgba(245,243,237,0.08); border-radius: 10px; padding: 9px 12px; font-size: 12px; font-weight: 600; color: #F5F3ED; cursor: pointer; text-align: left; width: 100%; }
  .q-option.selected { border-color: #FF6B4A; background: rgba(255,107,74,0.1); }
  .q-option.asked { opacity: 0.35; cursor: default; }
  .ai-bubble { border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; text-align: center; }
  .ai-bubble.oui { background: rgba(76,217,100,0.12); border: 1px solid rgba(76,217,100,0.3); }
  .ai-bubble.non { background: rgba(255,107,74,0.12); border: 1px solid rgba(255,107,74,0.3); }
  .ai-answer { font-size: 18px; font-weight: 900; }
  .ai-answer.oui { color: #4CD964; }
  .ai-answer.non { color: #FF6B4A; }
  .ai-sub { font-size: 11px; color: rgba(245,243,237,0.4); margin-top: 3px; }
  .handoff { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 32px; text-align: center; gap: 20px; }
  .handoff h2 { font-size: 24px; font-weight: 900; }
  .guess-list { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .guess-card { background: #1F2242; border: 1px solid rgba(245,243,237,0.08); border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; color: #F5F3ED; text-align: left; }
  .back-q { width: 100%; padding: 10px 0; border-radius: 12px; border: 1px solid rgba(245,243,237,0.1); background: transparent; color: rgba(245,243,237,0.45); font-weight: 600; font-size: 13px; cursor: pointer; margin-top: 8px; }
  .player-bar { padding: 7px 20px; background: rgba(255,107,74,0.1); font-size: 13px; color: #FF6B4A; font-weight: 700; text-align: center; flex-shrink: 0; }

  screen:"home", mode:"solo", cat:null,

  phase:"playing", finalGuess:null
};

function initials(n){ return n.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase(); }

function avatar(name, size=40){
  const d = document.createElement("div");
  d.className = "avatar";
  d.style.cssText = `width:${size}px;height:${size}px;font-size:${size*0.32}px;`;
  const url = PHOTOS[name];
  if(url){
    const img = document.createElement("img");
    img.src = url;
    img.alt = name;
    img.referrerPolicy = "no-referrer";
    img.onerror = ()=>{ d.removeChild(img); d.textContent = initials(name); };
    d.appendChild(img);
  } else {
    d.textContent = initials(name);
  }
  return d;
}

function getReponse(catId, personnage, qIndex){
  return REPONSES[catId]?.[personnage]?.[qIndex] ?? null;
}

function eliminateByAnswer(catId, qIndex, answer){
  const cat = CATS.find(c=>c.id===catId);
  cat.personnages.forEach(p=>{
    const rep = getReponse(catId, p, qIndex);
    if(rep !== null && rep !== answer) state.eliminated.add(p);
  });
}

function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  app.className = state.screen==="game" ? "app game" : "app";
  if(state.screen==="home") renderHome(app);
  else if(state.screen==="handoff") renderHandoff(app);
  else if(state.screen==="pick") renderPick(app);
  else if(state.screen==="game") renderGame(app);
}

function renderHome(app){
  const div = document.createElement("div");
  div.className = "home";
  div.innerHTML = `
    <div>
      <div style="font-size:13px;color:#FF6B4A;font-weight:700;letter-spacing:1px">NOUVELLE PARTIE</div>
      <h1>Who Am I?</h1>
      <p style="margin-top:8px;color:rgba(245,243,237,0.5);font-size:15px;line-height:1.5">Devine la célébrité choisie par ton adversaire.</p>
    </div>
    <div>
      <div class="label">MODE DE JEU</div>
      <div class="mode-row">
        <button class="btn ${state.mode==='solo'?'btn-coral':'btn-dark'}" id="btn-solo">🤖 Solo</button>
        <button class="btn ${state.mode==='multi'?'btn-coral':'btn-dark'}" id="btn-multi">👥 Multijoueur</button>
      </div>
    </div>
    <div>
      <div class="label">CATÉGORIE</div>
      <div class="cat-grid" id="cat-grid"></div>
    </div>
    <button class="btn-full ${state.cat?'btn-coral':'btn-disabled'}" id="btn-start">
      ${state.cat?`Jouer — ${state.cat.nom}`:"Choisis une catégorie"}
    </button>
  `;
  app.appendChild(div);
  div.querySelector("#btn-solo").onclick = ()=>{ state.mode="solo"; render(); };
  div.querySelector("#btn-multi").onclick = ()=>{ state.mode="multi"; render(); };
  const grid = div.querySelector("#cat-grid");
  CATS.forEach(c=>{
    const btn = document.createElement("button");
    btn.className = "cat-card"+(state.cat?.id===c.id?" active":"");
    btn.innerHTML = `<div class="cat-emoji">${c.emoji}</div><div class="cat-name">${c.nom}</div>`;
    btn.onclick = ()=>{ state.cat=c; render(); };
    grid.appendChild(btn);
  });
  div.querySelector("#btn-start").onclick = ()=>{
    if(!state.cat) return;
    state.eliminated = new Set();
    state.askedQs = new Set();
    state.selectedQ = null;
    state.lastAnswer = null;
    state.phase = "playing";
    state.finalGuess = null;
    if(state.mode==="solo"){
      const list = state.cat.personnages;
      state.secrets = [list[Math.floor(Math.random()*list.length)], null];
      state.currentPlayer = 0;
      state.screen = "game";
    } else {
      state.pickingFor = 0;
      state.secrets = [null,null];
      state.screen = "handoff";
    }
    render();
  };
}

function renderHandoff(app){
  const div = document.createElement("div");
  div.className = "handoff";
  div.innerHTML = `
    <div style="font-size:56px">🙈</div>
    <h2>Passe l'appareil<br>au Joueur ${state.pickingFor+1}</h2>

  div.querySelector("#btn-ready").onclick = ()=>{ state.screen="pick"; render(); };
}

function renderPick(app){
  const div = document.createElement("div");
  div.className = "pick-screen";
  div.innerHTML = `
    <div>
      <div style="font-size:13px;color:#FF6B4A;font-weight:700">JOUEUR ${state.pickingFor+1}</div>
      <h2 style="margin-top:4px;font-size:22px;font-weight:800">Choisis le personnage secret de ton adversaire</h2>
    </div>
    <div class="pick-grid" id="pick-grid"></div>
    <button class="btn-full btn-disabled" id="btn-confirm">Confirmer</button>
  `;
  app.appendChild(div);
  let chosen = null;
  const grid = div.querySelector("#pick-grid");
  const confirmBtn = div.querySelector("#btn-confirm");
  state.cat.personnages.forEach(name=>{
    const card = document.createElement("button");
    card.className = "pick-card";
    card.appendChild(avatar(name,34));
    const span = document.createElement("span");
    span.style.cssText = "font-size:12px;font-weight:600;";
    span.textContent = name;
    card.appendChild(span);
    card.onclick = ()=>{
      chosen = name;
      grid.querySelectorAll(".pick-card").forEach(c=>c.classList.remove("active"));
      card.classList.add("active");
      confirmBtn.className = "btn-full btn-coral";
    };
    grid.appendChild(card);
  });
  confirmBtn.onclick = ()=>{
    if(!chosen) return;
    state.secrets[state.pickingFor] = chosen;
    if(state.pickingFor===0){
      state.pickingFor = 1;
      state.screen = "handoff";
    } else {
      state.currentPlayer = 0;
      state.eliminated = new Set();
      state.askedQs = new Set();
      state.selectedQ = null;
      state.lastAnswer = null;
      state.phase = "playing";
      state.finalGuess = null;
      state.screen = "game";
    }
    render();
  };
}

function renderGame(app){
  const cat = state.cat;
  // En multi : le joueur devine le personnage choisi PAR l'autre joueur
  const secret = state.mode==="multi"
    ? state.secrets[state.currentPlayer===0 ? 1 : 0]
    : state.secrets[0];

  const header = document.createElement("div");
  header.className = "header";
  header.innerHTML = `
    <button class="back-btn" id="btn-home">← Accueil</button>
    <span style="font-weight:700;font-size:14px">${cat.emoji} ${cat.nom}</span>
    <span class="badge">${cat.personnages.length - state.eliminated.size} restants</span>
  `;
  app.appendChild(header);
  header.querySelector("#btn-home").onclick = ()=>{ state.screen="home"; render(); };

  if(state.mode==="multi"){
    const bar = document.createElement("div");
    bar.className = "player-bar";
    bar.textContent = `Joueur ${state.currentPlayer+1} — devine le personnage de l'autre`;
    app.appendChild(bar);
  }

  const grid = document.createElement("div");
  grid.className = "char-grid";
  cat.personnages.forEach(name=>{
    const out = state.eliminated.has(name);
    const card = document.createElement("button");
    card.className = "char-card"+(out?" out":"");
    card.appendChild(avatar(name,36));
    const span = document.createElement("span");
    span.className = "char-name"+(out?" out":"");
    span.textContent = name;
    card.appendChild(span);
    card.onclick = ()=>{
      if(state.eliminated.has(name)) state.eliminated.delete(name);
      else state.eliminated.add(name);
      render();
    };
    grid.appendChild(card);
  });
  app.appendChild(grid);
  const panel = document.createElement("div");
  panel.className = "panel";

  if(state.phase==="playing"){
    if(state.lastAnswer){
      const bubble = document.createElement("div");
      bubble.className = `ai-bubble ${state.lastAnswer.rep?"oui":"non"}`;
      bubble.innerHTML = `
        <div class="ai-answer ${state.lastAnswer.rep?"oui":"non"}">${state.lastAnswer.rep?"✅ OUI":"❌ NON"}</div>
        <div class="ai-sub">${state.lastAnswer.q}</div>
      `;
      panel.appendChild(bubble);
    }

    const qlabel = document.createElement("div");
    qlabel.className = "q-label";
    qlabel.textContent = "Choisis une question :";
    panel.appendChild(qlabel);

    const qlist = document.createElement("div");
    qlist.className = "q-selector";
    cat.questions.forEach((q,i)=>{
      const asked = state.askedQs.has(i);
      const btn = document.createElement("button");
      btn.className = "q-option"+(state.selectedQ===i?" selected":"")+(asked?" asked":"");
      btn.textContent = q;
      btn.disabled = asked;
      btn.onclick = ()=>{ if(!asked){ state.selectedQ=i; render(); } };
      qlist.appendChild(btn);
    });
    panel.appendChild(qlist);

    if(state.selectedQ !== null){
      const row = document.createElement("div");
      row.className = "btn-row";
      row.style.marginTop = "8px";

      if(state.mode==="solo"){
        const askBtn = document.createElement("button");
        askBtn.className = "btn btn-coral";
        askBtn.style.flex = "1";
        askBtn.textContent = "Poser la question →";
        askBtn.onclick = ()=>{
          const qi = state.selectedQ;
          const q = cat.questions[qi];
          const rep = getReponse(cat.id, secret, qi);
          state.askedQs.add(qi);
          state.selectedQ = null;
          if(rep !== null){
            state.lastAnswer = { q, rep };
            eliminateByAnswer(cat.id, qi, rep);
          }
          render();
        };
        row.appendChild(askBtn);
      } else {
        const labelEl = document.createElement("div");
        labelEl.className = "q-label";
        labelEl.textContent = "L'autre joueur répond :";
        labelEl.style.marginBottom = "6px";
        panel.appendChild(labelEl);

        ["Oui","Non"].forEach(label=>{
          const btn = document.createElement("button");
          btn.className = "btn "+(label==="Oui"?"btn-coral":"btn-dark");
          btn.textContent = label;
          btn.onclick = ()=>{
            const qi = state.selectedQ;
            const q = cat.questions[qi];
            const rep = label==="Oui";
            state.askedQs.add(qi);
            state.selectedQ = null;
            state.lastAnswer = { q, rep };
            eliminateByAnswer(cat.id, qi, rep);
            render();
          };
          row.appendChild(btn);
        });

        const nsppBtn = document.createElement("button");
        nsppBtn.className = "btn btn-outline";
        nsppBtn.textContent = "Je sais pas";
        nsppBtn.onclick = ()=>{
          state.askedQs.add(state.selectedQ);
          state.selectedQ = null;
          render();
        };
        row.appendChild(nsppBtn);
      }
      panel.appendChild(row);
    }

    const guessBtn = document.createElement("button");
    guessBtn.className = "btn-gold";
    guessBtn.textContent = "🎯 Deviner le personnage";
    guessBtn.onclick = ()=>{ state.phase="guessing"; render(); };
    panel.appendChild(guessBtn);
  }

  else if(state.phase==="guessing"){
    const title = document.createElement("div");
    title.style.cssText = "font-size:15px;font-weight:700;margin-bottom:10px;";
    title.textContent = "Qui est-ce selon toi ?";
    panel.appendChild(title);
    const list = document.createElement("div");
    list.className = "guess-list";
    cat.personnages.filter(n=>!state.eliminated.has(n)).forEach(name=>{
      const card = document.createElement("button");
      card.className = "guess-card";
      card.appendChild(avatar(name,32));
      const span = document.createElement("span");
      span.style.cssText = "font-size:13px;font-weight:600;";
      span.textContent = name;
      card.appendChild(span);
      card.onclick = ()=>{ state.finalGuess=name; state.phase="result"; render(); };
      list.appendChild(card);
    });
    panel.appendChild(list);

    const backBtn = document.createElement("button");
    backBtn.className = "back-q";
    backBtn.textContent = "← Continuer à poser des questions";
    backBtn.onclick = ()=>{ state.phase="playing"; render(); };
    panel.appendChild(backBtn);
  }

  else if(state.phase==="result"){
    const won = state.finalGuess === secret;
    const res = document.createElement("div");
    res.innerHTML = `
      <div style="text-align:center">
        <div style="font-size:44px;margin-bottom:8px">${won?"🎉":"😅"}</div>
        <div style="font-size:20px;font-weight:900;margin-bottom:6px">${won?"Bravo !":"Pas tout à fait…"}</div>
        <div style="font-size:14px;color:rgba(245,243,237,0.55);margin-bottom:18px">Le personnage était <strong style="color:#F4C95D">${secret}</strong></div>
      </div>
    `;
    if(state.mode==="multi" && state.currentPlayer===0){
      const btn = document.createElement("button");
      btn.className = "btn-full btn-coral";
      btn.textContent = "Tour du Joueur 2 →";
      btn.onclick = ()=>{
        state.currentPlayer = 1;
        state.eliminated = new Set();
        state.askedQs = new Set();
        state.selectedQ = null;
        state.lastAnswer = null;
        state.phase = "playing";
        state.finalGuess = null;
        render();
      };
      res.appendChild(btn);
    } else {
      const btn = document.createElement("button");
      btn.className = "btn-full btn-coral";
      btn.textContent = "Rejouer";
      btn.onclick = ()=>{ state.screen="home"; render(); };
      res.appendChild(btn);
    }
    panel.appendChild(res);
  }

  app.appendChild(panel);
}

render();
</script>
</body>
</html>
